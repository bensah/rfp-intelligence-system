[theme]
primaryColor = "#00703C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F4"
textColor = "#1B1B1B"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
