[theme]
# Warm palette for the scan/test phase (owner 2026-06-29): cream page + warm sand
# sidebar/widgets, keeping the CHAI brand green accent. backgroundColor mirrors
# core.app_header.THEME_BG_PAGE so the sticky top bar blends seamlessly.
primaryColor = "#00703C"
backgroundColor = "#FBF6EE"
secondaryBackgroundColor = "#F2E8D6"
textColor = "#23201B"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
