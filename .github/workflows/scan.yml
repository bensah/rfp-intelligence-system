name: Weekly RFP scan

# Runs the donor-source scanner with the Playwright "deep read" enabled — which
# can't run on Streamlit Community Cloud (no Chromium, memory-capped). This job
# installs Chromium and writes new RFPs straight to the same Supabase the live
# app reads, so accurate, deeply-read opportunities appear there.
#
# ONE-TIME SETUP: add two repository secrets under
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     SUPABASE_URL   (same value the app uses)
#     SUPABASE_KEY   (service-role key, or anon if RLS write policies are in place)
# Then trigger manually via the "Run workflow" button, or wait for the weekly run.

on:
  schedule:
    - cron: "0 6 * * 5"          # Fridays 06:00 UTC
  workflow_dispatch: {}          # manual "Run workflow" button

concurrency:
  group: rfp-scan
  cancel-in-progress: false      # never interrupt an in-flight scan mid-write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scan (deep read enabled)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Serper (real Google) powers the aggregator→source resolver. Optional:
          # without it the resolver simply no-ops and DevelopmentAid hits stay as
          # listings. Add SERPER_API_KEY as a repo Actions secret to enable it.
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # Multi-tenant: lets the per-tenant screening step treat the run as multi-tenant.
          # Optional — the --screen-tenants override works without it — but keeps the
          # app's tenant state consistent. Add SUPABASE_JWT_SECRET as a repo Actions secret.
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          # LLM synthesis + judging. WITHOUT these the cron stores RAW scraped preamble as
          # the brief (unformatted PDF dumps) and skips LLM budget/geo/theme extraction —
          # exactly the "raw brief" symptom. Point at an OpenAI-compatible endpoint (e.g.
          # Ollama Cloud). LLM_SYNTH_* fall back to LLM_JUDGE_* in code, so setting the
          # JUDGE pair alone enables BOTH; set the SYNTH pair too to use a different model.
          LLM_JUDGE_BASE_URL: ${{ secrets.LLM_JUDGE_BASE_URL }}
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
          LLM_JUDGE_MODEL: ${{ secrets.LLM_JUDGE_MODEL }}
          LLM_SYNTH_BASE_URL: ${{ secrets.LLM_SYNTH_BASE_URL }}
          LLM_SYNTH_API_KEY: ${{ secrets.LLM_SYNTH_API_KEY }}
          LLM_SYNTH_MODEL: ${{ secrets.LLM_SYNTH_MODEL }}
          RFPIS_DEEP_READ: "1"
          SCAN_INCLUDE_SEEDS: "1"
          SCAN_PARALLELISM: "6"
        # Option-C multi-tenant discovery: crawl → SHARED extracted store (--extract-only),
        # then auto-screen EACH active tenant into its own pipeline (--screen-tenants).
        run: python scripts/run_scan.py --triggered-by cron --extract-only --screen-tenants
