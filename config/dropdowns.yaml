# 1 unit of currency -> X USD (i.e. multiply native amount by rate to get USD).
# Source: original Excel Dropdown sheet, columns "currency" + "rate".
# XAF/CAD are inverted in the Excel (USD per native); kept faithful here.
currencies:
  - code: USD
    label: "USD"
    symbol: "$"
    aliases: ["USD $", "US$", "$"]
    usd_rate: 1.0
  - code: GBP
    label: "GBP"
    symbol: "£"
    aliases: ["GBP £", "£"]
    usd_rate: 1.33   # matches the Excel workbook's USD conversion rate
  - code: EUR
    label: "EUR"
    symbol: "€"
    aliases: ["Euro", "Euro €", "€"]
    usd_rate: 1.16   # matches the Excel workbook's USD conversion rate
  - code: XAF
    label: "FCFA"
    symbol: null      # no official symbol; render as "XAF 500,000 FCFA"
    aliases: ["FCFA", "F CFA"]
    usd_rate: 0.00166  # ~1/603
  - code: CAD
    label: "CAD"
    symbol: "C$"
    aliases: ["CAD $", "Can$", "C$"]
    usd_rate: 0.73     # ~1/1.44
