feasibility: [High, Medium, Low]

# Quoted to prevent YAML 1.1 boolean coercion ("Yes" → True, "No" → False).
# These are the canonical labels for the 9 MUST/PREFER criteria.
eligibility_values: ["True", "Partial", "False"]

stages:
  - Identification & screening
  - Go/no-go decision & bid planning
  - Proposal development
  - Budgeting development
  - Review, compliance check & approvals
  - Final packaging & submission
  - Post-submission follow-up

decisions: [Proceed, Proceed as sub, Park, Decline]

donor_decision: [Approved, Not Approved, Under Review, Not submitted]

funding_window: [One-off, Rolling]

applicant_role: [Prime, Sub, Technical]

time_to_award: ["<=3 months", "3-6 months", ">=6 months"]

submission_format:
  - Online Application Form
  - Narrative Template
  - Concept Note
  - Letter of Interest
  - Expression of Interest
  - Other

# Lifecycle of a Proceed RFP.
# - Not Started / In Progress: pre-submission work
# - Completed:    proposal submitted to donor (donor decision determines next)
# - Discontinued: team intentionally dropped the opportunity (still in window)
# - Missed:       deadline passed without submission (unintended miss)
progress_status: ["Not Started", "In Progress", "Completed", "Discontinued", "Missed"]

deadline_status: [On Track, Due Soon, Overdue]

engagement_types: [Call, Pitch, Conference, Scoping, Site Visit, Email Exchange, Other]

engagement_formats: [In-person, Virtual, Written, Hybrid]

report_types: [Financial, Annual, Final, Ad-hoc, Interim]

report_statuses: [Not Started, In Progress, Submitted, Overdue, Accepted]

narrative_uses: [Partner meeting, Conference, Website, Internal brief, Other]

narrative_statuses: [Current, Archived]

