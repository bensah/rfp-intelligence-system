# Placeholder team-member list — overwrite via Admin → Settings →
# Team members when you stand up a new deployment. The real names live
# in the database (app_settings JSON override), NOT in this checked-in
# config, so a public repo never exposes who's on the deploying-org's
# team. Adding "Other" as the last entry lets submitters type in a
# guest contributor's name without admin needing to update this list.
